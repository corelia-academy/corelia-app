# One-shot manual workflow: đồng bộ lại supabase_migrations.schema_migrations
# sau khi các migration 20260702* được thêm với timestamp SỚM HƠN một migration
# đã apply trên remote (history table lệch với file local).
#
# Cách dùng: Actions → "Reconcile Supabase Migration History" → Run workflow,
# chọn environment (staging / production). Chạy MỘT LẦN cho mỗi env bị lệch.
# Xong rồi XOÁ file này — nó không thuộc luồng deploy thường ngày.

name: Reconcile Supabase Migration History

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment cần reconcile
        type: environment
        required: true

concurrency:
  group: reconcile-migrations-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Reconcile migration history
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --dns-resolver https

          # Xoá bookkeeping row của cả 5 (|| true: bỏ qua nếu version chưa có trong history)
          for v in 20260702000000 20260702010000 20260702020000 20260702030000 20260702040000; do
            supabase migration repair --status reverted "$v" --linked --dns-resolver https || true
          done

          # Apply lại toàn bộ 5 (SQL idempotent) và ghi nhận đầy đủ vào history
          supabase migration up --linked --include-all --dns-resolver https
