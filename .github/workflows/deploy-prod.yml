name: Deploy Production

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/config.toml"
  workflow_dispatch: {}

# ─── PRODUCTION GATE ────────────────────────────────────────────────────────
#
# `environment: name: production` liên kết job này với GitHub Environment
# "production". Environment đã được tạo tại Settings → Environments.
#
# "Required reviewers" (approval gate) KHÔNG khả dụng trên GitHub Free
# với private repo — chỉ có trên GitHub Pro / Team / Enterprise.
#
# Thay thế phù hợp cho tài khoản cá nhân (Free):
# → Dùng Branch Protection Rule trên nhánh `main`:
#   Settings → Branches → Add branch ruleset → chọn nhánh `main`
#   Bật "Require a pull request before merging" + "Required approvals: 1"
#   → Không ai push thẳng lên main được, mọi thay đổi phải qua PR review.
#   → Khi PR được merge vào main, workflow này tự chạy và deploy prod.
#
# ────────────────────────────────────────────────────────────────────────────

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      checks: write
      statuses: write
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Detect Supabase changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [[ -z "${BEFORE}" || "${BEFORE}" =~ ^0+$ ]]; then
            BEFORE="$(git rev-parse "${AFTER}^" 2>/dev/null || true)"
          fi
          if [[ -z "${BEFORE}" ]]; then
            echo "migrations_changed=true" >> "$GITHUB_OUTPUT"
            echo "functions_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED="$(git diff --name-only "$BEFORE" "$AFTER")"
          echo "$CHANGED"

          if echo "$CHANGED" | grep -qE '^supabase/migrations/'; then
            echo "migrations_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "migrations_changed=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$CHANGED" | grep -qE '^supabase/functions/'; then
            echo "functions_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "functions_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Supabase CLI
        if: steps.changes.outputs.migrations_changed == 'true' || steps.changes.outputs.functions_changed == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply Supabase migrations
        if: steps.changes.outputs.migrations_changed == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase migration up --linked --include-all

      - name: Deploy Edge Function (corelia-api)
        if: steps.changes.outputs.functions_changed == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy corelia-api --project-ref "$SUPABASE_PROJECT_REF"
