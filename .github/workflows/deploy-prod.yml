name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full approved G2 release commit SHA
        required: true
        type: string
      confirmation:
        description: Type DEPLOY_R5_DB_EDGE_TO_PRODUCTION
        required: true
        type: string
      recovery_limitations_accepted:
        description: >-
          Accept that the physical backup was rechecked, PITR is unavailable,
          restore is unrehearsed, RPO/RTO are unmeasured, forward-fix is the
          primary DB migration recovery strategy, and Edge/frontend rollback
          may be unrehearsed
        required: true
        type: boolean

# ─── PRODUCTION GATE ────────────────────────────────────────────────────────
#
# `environment: name: production` liên kết job này với GitHub Environment
# "production" (được cấu hình chỉ chấp nhận workflow chạy trên nhánh main).
#
# Quy trình phát hành Production hai giai đoạn (Two-Stage Release):
# → Giai đoạn A (Control-Plane Bootstrap): Merge commit workflow/guard này lên main.
# → Giai đoạn B (G2 Release): Chạy manual workflow_dispatch trên main với input
#   release_sha trỏ vào commit manifest R5 đã được kiểm duyệt.
# → Workflow check out đúng release_sha, kiểm tra manifest, kiểm tra ledger 139,
#   chạy đúng 16 forward migrations, chạy post-migration live DB check, và deploy
#   hai Edge Functions cần thiết (ai-tutor, corelia-api).
# → Merge main kích hoạt frontend Cloudflare Production theo pipeline riêng sau khi
#   hậu kiểm DB/Edge hoàn tất.
#
# ────────────────────────────────────────────────────────────────────────────

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  verify:
    name: Full pre-deploy verification
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Verify approved release artifact identity and manifest
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          APPROVED_RELEASE_SHA: ${{ vars.APPROVED_PRODUCTION_RELEASE_SHA }}
          PRODUCTION_RELEASE_MANIFEST_SHA256: ${{ vars.APPROVED_PRODUCTION_RELEASE_MANIFEST_SHA256 }}
          CONFIRMATION: ${{ inputs.confirmation }}
          RECOVERY_LIMITATIONS_ACCEPTED: ${{ inputs.recovery_limitations_accepted }}
        run: |
          test "$CONFIRMATION" = "DEPLOY_R5_DB_EDGE_TO_PRODUCTION"
          # true means the operator rechecked the physical backup and explicitly
          # accepts: no PITR, unrehearsed restore, unmeasured RPO/RTO,
          # forward-fix as the primary DB migration recovery strategy, and
          # potentially unrehearsed Edge/frontend rollback.
          test "$RECOVERY_LIMITATIONS_ACCEPTED" = "true"
          test -n "$APPROVED_RELEASE_SHA"
          test -n "$PRODUCTION_RELEASE_MANIFEST_SHA256"
          test "$RELEASE_SHA" = "$APPROVED_RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$APPROVED_RELEASE_SHA"
          git fetch origin main
          git cat-file -e "66981c2044b515a6fa07a71d06f8265d171d6a74^{commit}"
          node scripts/db/verify-production-release-artifact.mjs 66981c2044b515a6fa07a71d06f8265d171d6a74 "$APPROVED_RELEASE_SHA"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.98.1

      - name: Verify migration governance and guardrails
        run: pnpm db:verify

      - name: Run full application test suite
        run: pnpm test

      - name: Run lint
        run: pnpm lint

      - name: Build and verify Production frontend artifact
        env:
          VITE_SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_CDN_BASE_URL: ${{ vars.VITE_CDN_BASE_URL }}
          EXPECTED_PRODUCTION_SUPABASE_URL: https://lawhkvyyoznwygzsycan.supabase.co
          EXPECTED_PRODUCTION_CDN_URL: ${{ vars.VITE_CDN_BASE_URL }}
        run: |
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          test -n "$VITE_CDN_BASE_URL"
          pnpm build:prod
          node scripts/db/verify-production-frontend-artifact.mjs dist "$RUNNER_TEMP/production-frontend-artifact.json"
          node -e 'const fs=require("node:fs"); const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Production frontend artifact\n\n- Supabase project ref: \`${r.supabaseProjectRef}\`\n- CDN origin: \`${r.cdnOrigin}\`\n- App version: \`${r.appVersion}\`\n- Files: \`${r.fileCount}\`\n- Artifact SHA-256: \`${r.artifactSha256}\`\n`)' "$RUNNER_TEMP/production-frontend-artifact.json"

      - name: Cleanly recreate isolated local migration chain
        run: |
          supabase start
          pnpm db:verify:local

      - name: Stop isolated local Supabase stack
        if: always()
        run: supabase stop --no-backup

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      checks: write
      statuses: write
      deployments: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Re-verify release artifact immediately before Production writes
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          APPROVED_RELEASE_SHA: ${{ vars.APPROVED_PRODUCTION_RELEASE_SHA }}
          PRODUCTION_RELEASE_MANIFEST_SHA256: ${{ vars.APPROVED_PRODUCTION_RELEASE_MANIFEST_SHA256 }}
        run: |
          test -n "$APPROVED_RELEASE_SHA"
          test -n "$PRODUCTION_RELEASE_MANIFEST_SHA256"
          test "$RELEASE_SHA" = "$APPROVED_RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$APPROVED_RELEASE_SHA"
          git fetch origin main
          git cat-file -e "66981c2044b515a6fa07a71d06f8265d171d6a74^{commit}"
          node scripts/db/verify-production-release-artifact.mjs 66981c2044b515a6fa07a71d06f8265d171d6a74 "$APPROVED_RELEASE_SHA"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.98.1

      # Deploy the R5 callback guard before the DB migration. NEW EDGE is
      # compatible with the released DB RPC, while OLD EDGE can pre-mark a
      # late ai_subscription callback paid during the migration window.
      - name: Deploy Edge Function (corelia-api)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          test "$SUPABASE_PROJECT_REF" = "lawhkvyyoznwygzsycan"
          supabase functions deploy corelia-api --project-ref "$SUPABASE_PROJECT_REF"

      - name: Verify exact Production migration state and apply approved migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          test "$SUPABASE_PROJECT_REF" = "lawhkvyyoznwygzsycan"
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --dns-resolver https
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD" --dns-resolver https > "$RUNNER_TEMP/production-pre-migration-list.txt"
          node scripts/db/verify-production-migration-state.mjs "$RUNNER_TEMP/production-pre-migration-list.txt"
          supabase migration up --linked --dns-resolver https

      - name: Verify live DB post-migration state and data invariants (Pre-Edge Gate)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD" --dns-resolver https > "$RUNNER_TEMP/production-post-migration-list.txt"
          supabase db query --linked --file scripts/db/production-post-migration-inspect.sql > "$RUNNER_TEMP/production-post-inspection.json"
          node scripts/db/verify-production-post-migration.mjs "$RUNNER_TEMP/production-post-migration-list.txt" "$RUNNER_TEMP/production-post-inspection.json"

      - name: Deploy Edge Function (ai-tutor - retired tombstone)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy ai-tutor --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Function (embed-lesson - retired tombstone)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy embed-lesson --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Function (generate-description)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy generate-description --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Function (generate-flashcards - retired tombstone)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy generate-flashcards --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Function (generate-learning-path - retired tombstone)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy generate-learning-path --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Function (generate-lesson-summary - retired tombstone)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy generate-lesson-summary --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Function (generate-questions)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy generate-questions --project-ref "$SUPABASE_PROJECT_REF"

      - name: Verify live DB post-Edge final runtime invariants (Post-Edge Gate)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD" --dns-resolver https > "$RUNNER_TEMP/production-final-migration-list.txt"
          supabase db query --linked --file scripts/db/production-post-migration-inspect.sql > "$RUNNER_TEMP/production-final-inspection.json"
          node scripts/db/verify-production-post-migration.mjs "$RUNNER_TEMP/production-final-migration-list.txt" "$RUNNER_TEMP/production-final-inspection.json"
