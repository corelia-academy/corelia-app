name: Deploy Production

on:
  workflow_dispatch: {}

# ─── PRODUCTION GATE ────────────────────────────────────────────────────────
#
# `environment: name: production` liên kết job này với GitHub Environment
# "production" (được cấu hình chỉ chấp nhận workflow chạy trên nhánh main).
#
# "Required reviewers" (approval gate) KHÔNG khả dụng trên GitHub Free
# với private repo — chỉ có trên GitHub Pro / Team / Enterprise.
#
# Production chỉ deploy thủ công bằng workflow_dispatch trên nhánh `main`.
# Merge/push vào `main` không tự động chạy workflow này.
#
# ────────────────────────────────────────────────────────────────────────────

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  verify:
    name: Full pre-deploy verification
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.98.1

      - name: Verify Jobs scheduler secret is configured
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          test "$SUPABASE_PROJECT_REF" = "lawhkvyyoznwygzsycan"
          secrets_json="$(supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" --output json)"
          jq --exit-status 'map(.name) | index("CORELIA_JOBS_CRON_SECRET") != null' <<< "$secrets_json" > /dev/null

      - name: Verify migration governance and guardrails
        run: pnpm db:verify

      - name: Run full application test suite
        run: pnpm test

      - name: Run lint
        run: pnpm lint

      - name: Build and verify Production frontend artifact
        env:
          VITE_SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_CDN_BASE_URL: ${{ vars.VITE_CDN_BASE_URL }}
          EXPECTED_PRODUCTION_SUPABASE_URL: https://lawhkvyyoznwygzsycan.supabase.co
          EXPECTED_PRODUCTION_CDN_URL: ${{ vars.VITE_CDN_BASE_URL }}
        run: |
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          test -n "$VITE_CDN_BASE_URL"
          pnpm build:prod
          node scripts/db/verify-production-frontend-artifact.mjs dist "$RUNNER_TEMP/production-frontend-artifact.json"
          node -e 'const fs=require("node:fs"); const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Production frontend artifact\n\n- Supabase project ref: \`${r.supabaseProjectRef}\`\n- CDN origin: \`${r.cdnOrigin}\`\n- App version: \`${r.appVersion}\`\n- Files: \`${r.fileCount}\`\n- Artifact SHA-256: \`${r.artifactSha256}\`\n`)' "$RUNNER_TEMP/production-frontend-artifact.json"

      - name: Cleanly recreate isolated local migration chain
        timeout-minutes: 15
        run: |
          supabase start
          pnpm db:verify:local

      - name: Stop isolated local Supabase stack
        if: always()
        run: supabase stop --no-backup

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      checks: write
      statuses: write
      deployments: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.98.1

      # The free-only API is compatible with the old schema and must land first.
      - name: Deploy Edge Function (corelia-api)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          test "$SUPABASE_PROJECT_REF" = "lawhkvyyoznwygzsycan"
          supabase functions deploy corelia-api --project-ref "$SUPABASE_PROJECT_REF"

      - name: Purge retired financial Storage objects
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          test "$SUPABASE_PROJECT_REF" = "lawhkvyyoznwygzsycan"
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --dns-resolver https
          for prefix in course-partner-docs instructor-partner-docs; do
            objects="$(supabase storage ls "ss:///app/$prefix" --recursive --linked --experimental --output json)"
            if [[ -n "$objects" ]] && [[ "$(jq 'length' <<<"$objects")" != "0" ]]; then
              supabase storage rm --recursive "ss:///app/$prefix" --linked --experimental --yes
            fi
            remaining="$(supabase storage ls "ss:///app/$prefix" --recursive --linked --experimental --output json)"
            [[ -z "$remaining" ]] || [[ "$(jq 'length' <<<"$remaining")" = "0" ]]
          done

      - name: Verify exact Production migration state and apply approved migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          test "$SUPABASE_PROJECT_REF" = "lawhkvyyoznwygzsycan"
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --dns-resolver https
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD" --dns-resolver https > "$RUNNER_TEMP/production-pre-migration-list.txt"
          node scripts/db/verify-production-migration-state.mjs "$RUNNER_TEMP/production-pre-migration-list.txt"
          supabase migration up --linked --dns-resolver https

      - name: Verify Jobs scheduler Vault configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          test "$SUPABASE_PROJECT_REF" = "lawhkvyyoznwygzsycan"
          supabase db query --linked --file scripts/db/verify-jobs-scheduler-vault.sql --agent=no

      - name: Verify live DB post-migration state and data invariants (Pre-Edge Gate)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD" --dns-resolver https > "$RUNNER_TEMP/production-post-migration-list.txt"
          supabase db query --linked --file scripts/db/audit-production-ai-state.sql --output json > "$RUNNER_TEMP/production-post-inspection.json"
          node scripts/db/verify-production-post-migration.mjs "$RUNNER_TEMP/production-post-migration-list.txt" "$RUNNER_TEMP/production-post-inspection.json"

      - name: Verify Supabase Security Advisor has no database warnings
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          advisor_output="$(supabase db advisors --linked --type security --level warn)"
          echo "$advisor_output"
          # CLI 2.98.1 writes "No issues found" to stderr and leaves stdout empty.
          if [[ -z "$advisor_output" || "$advisor_output" == "No issues found" ]]; then
            exit 0
          fi
          # HIBP protection is a project-plan Auth setting. pg_net is registered
          # against public but creates its callable objects in its own net schema;
          # it is non-relocatable and is required by the Jobs Edge scheduler.
          jq --exit-status 'all(.[];
            .name == "auth_leaked_password_protection" or
            (.name == "extension_in_public" and .metadata.name == "pg_net" and .metadata.schema == "public")
          )' <<< "$advisor_output"

      - name: Deploy Edge Function (cron-jobs)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy cron-jobs --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Function (generate-description)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy generate-description --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Function (generate-questions)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy generate-questions --project-ref "$SUPABASE_PROJECT_REF"

      - name: Remove learner-facing AI Edge functions and unused secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: scripts/retire-learner-ai-edge.sh

      - name: Verify live DB post-Edge final runtime invariants (Post-Edge Gate)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD" --dns-resolver https > "$RUNNER_TEMP/production-final-migration-list.txt"
          supabase db query --linked --file scripts/db/audit-production-ai-state.sql --output json > "$RUNNER_TEMP/production-final-inspection.json"
          node scripts/db/verify-production-post-migration.mjs "$RUNNER_TEMP/production-final-migration-list.txt" "$RUNNER_TEMP/production-final-inspection.json"
