name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# ─── PRODUCTION GATE ────────────────────────────────────────────────────────
#
# `environment: name: production` liên kết job này với GitHub Environment
# "production". Environment đã được tạo tại Settings → Environments.
#
# "Required reviewers" (approval gate) KHÔNG khả dụng trên GitHub Free
# với private repo — chỉ có trên GitHub Pro / Team / Enterprise.
#
# Thay thế phù hợp cho tài khoản cá nhân (Free):
# → Dùng Branch Protection Rule trên nhánh `main`:
#   Settings → Branches → Add branch ruleset → chọn nhánh `main`
#   Bật "Require a pull request before merging" + "Required approvals: 1"
#   → Không ai push thẳng lên main được, mọi thay đổi phải qua PR review.
#   → Khi PR được merge vào main, workflow này tự chạy và deploy prod.
#
# ────────────────────────────────────────────────────────────────────────────

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      checks: write
      statuses: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps (root)
        run: pnpm install --frozen-lockfile

      - name: Build (prod)
        run: |
          node -e "const req=['VITE_FIREBASE_API_KEY','VITE_FIREBASE_AUTH_DOMAIN','VITE_FIREBASE_PROJECT_ID','VITE_FIREBASE_STORAGE_BUCKET','VITE_FIREBASE_MESSAGING_SENDER_ID','VITE_FIREBASE_APP_ID','VITE_RECAPTCHA_V3_SITE_KEY']; const missing=req.filter(k=>!(process.env[k]||'').trim()); if(missing.length){console.error('Missing env:', missing.join(', ')); process.exit(1);} console.log('Firebase web config: ok (apiKeyLen=%d, projectId=%s)', String(process.env.VITE_FIREBASE_API_KEY||'').length, process.env.VITE_FIREBASE_PROJECT_ID)"
          pnpm build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_RECAPTCHA_V3_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_V3_SITE_KEY }}
          VITE_OCID_CLIENT_ID: ${{ secrets.VITE_OCID_CLIENT_ID }}
          VITE_OCID_REDIRECT_URI: ${{ secrets.VITE_OCID_REDIRECT_URI }}
          VITE_YOUTUBE_API_KEY: ${{ secrets.VITE_YOUTUBE_API_KEY }}
          VITE_BETA_FEEDBACK_FORM_URL: ${{ secrets.VITE_BETA_FEEDBACK_FORM_URL }}
          VITE_APP_TITLE_SUFFIX: ${{ secrets.VITE_APP_TITLE_SUFFIX }}

      - name: Auth Firebase (service account)
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node -e "const fs=require('fs'); const raw=process.env.FIREBASE_SERVICE_ACCOUNT_JSON||''; const json=JSON.parse(raw); fs.writeFileSync('firebase-service-account.json', JSON.stringify(json)); console.log('service account JSON: ok'); console.log('service account project_id:', json.project_id); console.log('service account client_email:', json.client_email)"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$PWD/firebase-service-account.json" >> "$GITHUB_ENV"
          echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE=$PWD/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy (hosting + rules + indexes + storage)
        run: pnpm dlx firebase-tools deploy --project prod --only hosting,firestore:rules,firestore:indexes,storage

      - name: Install deps (functions)
        run: pnpm -C functions install --frozen-lockfile

      - name: Build (functions)
        run: pnpm -C functions build

      - name: Deploy (functions)
        run: pnpm dlx firebase-tools deploy --project prod --only functions --force
