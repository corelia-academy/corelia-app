name: Database Guardrails

on:
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/db/**"
      - "docs/db-baseline/**"
      - ".github/**"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

jobs:
  guardrails:
    name: Baseline and declaration guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Provision PostgreSQL server binaries in PATH
        run: |
          PG_BIN_DIR=$(dirname "$(find /usr/lib/postgresql -name initdb -type f 2>/dev/null | sort -V | tail -n 1)")
          if [ -n "$PG_BIN_DIR" ] && [ -d "$PG_BIN_DIR" ]; then
            echo "$PG_BIN_DIR" >> "$GITHUB_PATH"
            echo "Provisioned PostgreSQL server binaries from $PG_BIN_DIR into GITHUB_PATH"
          fi

      - name: Test guardrails
        run: pnpm db:guard:test

      - name: Verify frozen migration baseline
        run: pnpm db:baseline:verify

      - name: Require migration or approved exception
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          node scripts/db/verify-db-change-declaration.mjs \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.sha }}" \
            --pr-body-file "$RUNNER_TEMP/pr-body.md" \
            --labels "$PR_LABELS"

  local-migration-recreate:
    name: Clean local migration recreate
    needs: guardrails
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pre-pull Supabase Postgres image
        run: |
          image=ghcr.io/supabase/postgres:17.6.1.156
          # Same image on public.ecr.aws, pinned by digest, for when ghcr.io rate-limits pulls.
          mirror=public.ecr.aws/supabase/postgres@sha256:ca7871b587ca2c401ac0f325df6249c9aa0d25647ded34631158efc51176767f
          for delay in 0 15 45; do
            if [ "$delay" -gt 0 ]; then sleep "$delay"; fi
            if docker pull "$image"; then exit 0; fi
            if docker pull "$mirror" && docker tag "$mirror" "$image"; then exit 0; fi
          done
          exit 1

      - name: Start isolated local Supabase stack
        run: |
          # Reserved-role denial probes crash on the CLI's older default image.
          mkdir -p supabase/.temp
          printf '%s' '17.6.1.156' > supabase/.temp/postgres-version
          if ! pnpm exec supabase start; then
            # ghcr.io also rate-limits the other service images; the CLI's default registry serves the same tags.
            pnpm exec supabase stop --no-backup || true
            docker tag ghcr.io/supabase/postgres:17.6.1.156 public.ecr.aws/supabase/postgres:17.6.1.156
            SUPABASE_INTERNAL_IMAGE_REGISTRY=public.ecr.aws pnpm exec supabase start
          fi

      - name: Apply every migration to an empty local database
        run: pnpm db:verify:local

      - name: Stop isolated local Supabase stack
        if: always()
        run: pnpm exec supabase stop --no-backup
