name: Database Guardrails

on:
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/db/**"
      - "docs/db-baseline/**"
      - ".github/**"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

jobs:
  guardrails:
    name: Baseline and declaration guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Provision PostgreSQL server binaries in PATH
        run: |
          PG_BIN_DIR=$(dirname "$(find /usr/lib/postgresql -name initdb -type f 2>/dev/null | sort -V | tail -n 1)")
          if [ -n "$PG_BIN_DIR" ] && [ -d "$PG_BIN_DIR" ]; then
            echo "$PG_BIN_DIR" >> "$GITHUB_PATH"
            echo "Provisioned PostgreSQL server binaries from $PG_BIN_DIR into GITHUB_PATH"
          fi

      - name: Test guardrails
        run: pnpm db:guard:test

      - name: Verify frozen migration baseline
        run: pnpm db:baseline:verify

      - name: Require migration or approved exception
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          node scripts/db/verify-db-change-declaration.mjs \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.sha }}" \
            --pr-body-file "$RUNNER_TEMP/pr-body.md" \
            --labels "$PR_LABELS"

  local-migration-recreate:
    name: Clean local migration recreate
    needs: guardrails
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pre-pull Supabase images
        # ghcr.io and public.ecr.aws both throttle runners for hours at a time;
        # the script falls back to Docker Hub and tags images for the CLI.
        env:
          SUPABASE_CLI: pnpm exec supabase
        run: |
          # Reserved-role denial probes crash on the CLI's older default image.
          mkdir -p supabase/.temp
          printf '%s' '17.6.1.156' > supabase/.temp/postgres-version
          bash scripts/ci/prepull-supabase-images.sh studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor

      - name: Start isolated local Supabase stack
        run: |
          # Only Postgres, Auth, REST, Storage, Realtime and Kong are needed for the
          # migration and policy suites; skipping the rest halves image pulls, which
          # otherwise fail whenever ghcr.io/ECR rate-limits the runner.
          pnpm exec supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor

      - name: Apply every migration to an empty local database
        run: pnpm db:verify:local

      - name: Stop isolated local Supabase stack
        if: always()
        run: pnpm exec supabase stop --no-backup
