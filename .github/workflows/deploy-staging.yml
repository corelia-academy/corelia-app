name: Deploy Staging

on:
  push:
    branches: [staging]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: staging
    permissions:
      contents: read
      checks: write
      statuses: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps (root)
        run: pnpm install --frozen-lockfile

      - name: Build (staging)
        run: pnpm build:staging
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: corelia-staging
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          VITE_OCID_CLIENT_ID: ${{ secrets.OCID_CLIENT_ID }}
          VITE_OCID_REDIRECT_URI: ${{ secrets.OCID_REDIRECT_URI }}
          VITE_YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          VITE_BETA_FEEDBACK_FORM_URL: ${{ secrets.BETA_FEEDBACK_FORM_URL }}

      - name: Auth Firebase (service account)
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node -e "const fs=require('fs'); const raw=process.env.FIREBASE_SERVICE_ACCOUNT_JSON||''; const json=JSON.parse(raw); fs.writeFileSync('firebase-service-account.json', JSON.stringify(json)); console.log('service account JSON: ok')"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$PWD/firebase-service-account.json" >> "$GITHUB_ENV"
          echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE=$PWD/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy (hosting + rules + indexes + storage)
        run: pnpm dlx firebase-tools deploy --project staging --only hosting,firestore:rules,firestore:indexes,storage

      - name: Install deps (functions)
        run: pnpm -C functions install --frozen-lockfile

      - name: Build (functions)
        run: pnpm -C functions build

      - name: Deploy (functions)
        run: pnpm dlx firebase-tools deploy --project staging --only functions
