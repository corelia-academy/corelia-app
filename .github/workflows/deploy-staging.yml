# Deploys Supabase (migrations + Edge functions) only.
# The Vite SPA / Workers frontend is published by the separate frontend deployment pipeline.
name: Deploy Staging

on:
  push:
    branches: [staging]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-staging.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  verify:
    name: Full pre-deploy verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.98.1

      - name: Verify migration governance and guardrails
        run: pnpm db:verify

      - name: Run full application test suite
        run: pnpm test

      - name: Run lint and staging build
        run: |
          pnpm lint
          pnpm build:staging

      - name: Cleanly recreate isolated local migration chain
        run: |
          supabase start
          pnpm db:verify:local

      - name: Stop isolated local Supabase stack
        if: always()
        run: supabase stop --no-backup

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: staging
    permissions:
      contents: read
      checks: write
      statuses: write
      deployments: write
    steps:
      - uses: actions/checkout@v5
        with:
          # Needed for git diff between github.event.before and github.sha
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.98.1

      - name: Apply Supabase migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --dns-resolver https
          supabase migration up --linked --dns-resolver https --include-all

      - name: Deploy Edge Function (corelia-api)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy corelia-api --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Function (ai-tutor)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy ai-tutor --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Function (generate-description)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy generate-description --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Function (generate-questions)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy generate-questions --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Function (generate-lesson-summary)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy generate-lesson-summary --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Function (generate-flashcards)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy generate-flashcards --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Function (embed-lesson)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy embed-lesson --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Function (generate-learning-path)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy generate-learning-path --project-ref "$SUPABASE_PROJECT_REF"
