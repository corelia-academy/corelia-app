# Deploys Supabase (migrations + Edge functions) and the staging Vite/Workers frontend.
name: Deploy Staging

on:
  push:
    branches: [staging]
    paths:
      - "src/**"
      - "public/**"
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/config.toml"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-staging.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: staging
    permissions:
      contents: read
      checks: write
      statuses: write
      deployments: write
    steps:
      - uses: actions/checkout@v5
        with:
          # Needed for git diff between github.event.before and github.sha
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply Supabase migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --dns-resolver https
          supabase migration up --linked --dns-resolver https

      - name: Deploy Edge Function (corelia-api)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy corelia-api --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Function (ai-tutor)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy ai-tutor --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Function (generate-description)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy generate-description --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Function (generate-questions)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy generate-questions --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Function (generate-lesson-summary)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy generate-lesson-summary --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Function (generate-flashcards)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy generate-flashcards --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Function (embed-lesson)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy embed-lesson --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Function (generate-learning-path)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy generate-learning-path --project-ref "$SUPABASE_PROJECT_REF"

      - name: Build staging frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_OCID_CLIENT_ID: ${{ secrets.VITE_OCID_CLIENT_ID || vars.VITE_OCID_CLIENT_ID }}
          VITE_OCID_REDIRECT_URI: ${{ secrets.VITE_OCID_REDIRECT_URI || vars.VITE_OCID_REDIRECT_URI }}
          VITE_YOUTUBE_API_KEY: ${{ secrets.VITE_YOUTUBE_API_KEY || vars.VITE_YOUTUBE_API_KEY }}
          VITE_BETA_FEEDBACK_FORM_URL: ${{ secrets.VITE_BETA_FEEDBACK_FORM_URL || vars.VITE_BETA_FEEDBACK_FORM_URL }}
          VITE_HCAPTCHA_SITEKEY: ${{ secrets.VITE_HCAPTCHA_SITEKEY || vars.VITE_HCAPTCHA_SITEKEY }}
          VITE_CDN_BASE_URL: ${{ secrets.VITE_CDN_BASE_URL || vars.VITE_CDN_BASE_URL }}
        run: pnpm build:staging

      - name: Deploy staging frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --env staging
