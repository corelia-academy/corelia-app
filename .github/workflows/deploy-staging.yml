# Deploys Supabase (migrations + Edge functions) only.
# The Vite SPA / Workers frontend is published by the separate frontend deployment pipeline.
name: Deploy Staging

on:
  push:
    branches: [staging]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-staging.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  verify:
    name: Full pre-deploy verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.98.1

      - name: Verify migration governance and guardrails
        run: pnpm db:verify

      - name: Run full application test suite
        run: pnpm test

      - name: Run lint and staging build
        run: |
          pnpm lint
          pnpm build:staging

      - name: Cleanly recreate isolated local migration chain
        timeout-minutes: 15
        run: |
          supabase start
          pnpm db:verify:local

      - name: Stop isolated local Supabase stack
        if: always()
        run: supabase stop --no-backup

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: staging
    permissions:
      contents: read
      checks: write
      statuses: write
      deployments: write
    steps:
      - uses: actions/checkout@v5
        with:
          # Needed for git diff between github.event.before and github.sha
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.98.1

      - name: Detect destructive Streak cleanup rollout
        id: streak_cleanup
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            changed_files="supabase/migrations/20260827130000_remove_daily_streak_feature.sql"
          elif [[ -z "$EVENT_BEFORE" || "$EVENT_BEFORE" =~ ^0+$ ]]; then
            changed_files="$(git show --format= --name-only "$EVENT_SHA")"
          else
            changed_files="$(git diff --name-only "$EVENT_BEFORE" "$EVENT_SHA")"
          fi

          if grep -Fxq "supabase/migrations/20260827130000_remove_daily_streak_feature.sql" <<<"$changed_files"; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy corelia-api before destructive Streak cleanup
        if: steps.streak_cleanup.outputs.required == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy corelia-api --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply Supabase migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --dns-resolver https
          supabase migration up --linked --dns-resolver https --include-all

      - name: Verify Supabase Security Advisor has no database warnings
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          advisor_output="$(supabase db advisors --linked --type security --level warn)"
          echo "$advisor_output"
          # CLI 2.98.1 writes "No issues found" to stderr and leaves stdout empty.
          if [[ -z "$advisor_output" || "$advisor_output" == "No issues found" ]]; then
            exit 0
          fi
          # HIBP protection is a project-plan Auth setting, not a database migration finding.
          jq --exit-status 'all(.[]; .name == "auth_leaked_password_protection")' <<< "$advisor_output"

      - name: Deploy Edge Function (corelia-api)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy corelia-api --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Function (generate-description)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy generate-description --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Function (generate-questions)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy generate-questions --project-ref "$SUPABASE_PROJECT_REF"

      - name: Remove learner-facing AI Edge functions and unused secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: scripts/retire-learner-ai-edge.sh
