<head>

  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --border: #2d3a4d;
      --text: #e7eef8;
      --muted: #8b9cae;
      --accent: #5b9fd4;
      --accent-dim: #3d7aad;
      --ok: #6bcf7f;
      --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      font-size: 15px;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(200px, 260px) 1fr;
      min-height: 100vh;
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      aside { position: relative !important; max-height: none !important; border-right: none; border-bottom: 1px solid var(--border); }
    }
    aside {
      position: sticky;
      top: 0;
      align-self: start;
      max-height: 100vh;
      overflow-y: auto;
      padding: 1rem 1rem 2rem;
      background: var(--surface);
      border-right: 1px solid var(--border);
    }
    aside h2 {
      margin: 0 0 0.75rem;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    aside nav a {
      display: block;
      padding: 0.35rem 0.5rem;
      border-radius: 6px;
      color: var(--text);
      text-decoration: none;
      font-size: 0.9rem;
    }
    aside nav a:hover { background: rgba(91, 159, 212, 0.12); color: var(--accent); }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }
    button {
      font: inherit;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      padding: 0.45rem 0.75rem;
      border-radius: 8px;
      font-size: 0.85rem;
    }
    button:hover { border-color: var(--accent-dim); color: var(--accent); }
    button.primary { background: var(--accent-dim); border-color: var(--accent); color: #fff; }
    button.primary:hover { filter: brightness(1.08); }
    .progress-wrap {
      margin-top: 0.75rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .progress-bar {
      height: 6px;
      background: var(--border);
      border-radius: 99px;
      margin-top: 0.35rem;
      overflow: hidden;
    }
    .progress-bar > span {
      display: block;
      height: 100%;
      background: var(--ok);
      border-radius: 99px;
      transition: width 0.2s ease;
    }
    main { padding: 1.5rem 2rem 4rem; max-width: 920px; }
    main h1 {
      margin: 0 0 1rem;
      font-size: 1.65rem;
      font-weight: 650;
    }
    article.section {
      margin-bottom: 3rem;
      scroll-margin-top: 1rem;
    }
    article.section h2 {
      margin: 0 0 0.5rem;
      font-size: 1.25rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
    }
    article.section h3 {
      margin: 1.25rem 0 0.5rem;
      font-size: 1rem;
      color: var(--accent);
    }
    .muted { color: var(--muted); font-size: 0.92rem; margin: 0.25rem 0 1rem; }
    .check-item {
      display: flex;
      gap: 0.65rem;
      align-items: flex-start;
      margin: 0.5rem 0;
      padding: 0.5rem 0.65rem;
      border-radius: 8px;
      background: rgba(255,255,255,0.03);
      border: 1px solid transparent;
    }
    .check-item:hover { border-color: var(--border); }
    .check-item input { margin-top: 0.35rem; accent-color: var(--accent-dim); }
    .check-item label { flex: 1; cursor: pointer; }
    pre, code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.82rem;
    }
    pre {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
      margin: 0.75rem 0;
    }
    th, td {
      border: 1px solid var(--border);
      padding: 0.45rem 0.6rem;
      text-align: left;
    }
    th { background: var(--surface); color: var(--muted); font-weight: 600; }
    .notes {
      width: 100%;
      min-height: 72px;
      margin-top: 1rem;
      padding: 0.65rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font: inherit;
      resize: vertical;
    }
    .section-actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin: 0.5rem 0 1rem;
    }
    hr.sep { border: none; border-top: 1px solid var(--border); margin: 1.25rem 0; }
    .pill {
      display: inline-block;
      font-size: 0.72rem;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      vertical-align: middle;
      margin-left: 0.35rem;
    }
  </style>
</head>

  function loadState() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}") || {};
    } catch (e) {
      return {};
    }
  }

  function saveState(state) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function collectAllIds() {
    var ids = [];
    MANUAL.sections.forEach(function (sec) {
      (sec.blocks || []).forEach(function (blk) {
        (blk.items || []).forEach(function (it) {
          ids.push(it.id);
        });
      });
    });
    return ids;
  }

  function renderNav() {
    var nav = document.getElementById("nav");
    nav.innerHTML = "";
    MANUAL.sections.forEach(function (s) {
      var a = document.createElement("a");
      a.href = "#" + s.id;
      a.textContent = s.title;
      nav.appendChild(a);
    });
  }

  function renderMain() {
    var main = document.getElementById("main");
    main.innerHTML =
      "<h1>Corelia QA — Staging checklist</h1>" +
      MANUAL.sections
        .map(function (sec) {
          var parts = [];
          parts.push('<article class="section" id="' + sec.id + '">');
          parts.push("<h2>" + escapeHtml(sec.title) + "</h2>");
          (sec.intro || []).forEach(function (line) {
            parts.push('<p class="muted">' + line + "</p>");
          });
          parts.push('<div class="section-actions">');
          parts.push('<button type="button" class="btn-section-all" data-section="' + sec.id + '">Đánh dấu hết section</button>');
          parts.push('<button type="button" class="btn-section-none" data-section="' + sec.id + '">Bỏ hết section</button>');
          parts.push("</div>");
          if (sec.staticHtml) parts.push(sec.staticHtml);
          (sec.blocks || []).forEach(function (blk) {
            if (blk.title) parts.push("<h3>" + escapeHtml(blk.title) + "</h3>");
            (blk.items || []).forEach(function (it) {
              parts.push(
                '<div class="check-item" data-check-wrap="' +
                  escapeHtml(it.id) +
                  '"><input type="checkbox" id="' +
                  escapeHtml(it.id) +
                  '" data-check="' +
                  escapeHtml(it.id) +
                  '" /><label for="' +
                  escapeHtml(it.id) +
                  '">' +
                  escapeHtml(it.text) +
                  "</label></div>"
              );
            });
          });
          parts.push("<hr class=\"sep\" />");
          parts.push("<label class=\"muted\" for=\"notes-" + sec.id + "\">Ghi chú / bug (lưu local)</label>");
          parts.push('<textarea class="notes" id="notes-' + sec.id + '" data-notes="' + sec.id + '" placeholder="ID case, bước, mong đợi, thực tế..."></textarea>');
          parts.push("</article>");
          return parts.join("");
        })
        .join("");
  }

  function escapeHtml(s) {
    var d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  var state = loadState();

  function applyChecksFromState() {
    collectAllIds().forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.checked = !!state.checks && !!state.checks[id];
    });
    MANUAL.sections.forEach(function (sec) {
      var ta = document.getElementById("notes-" + sec.id);
      if (ta && state.notes) ta.value = state.notes[sec.id] || "";
    });
    updateProgress();
  }

  function updateProgress() {
    var ids = collectAllIds();
    var done = ids.filter(function (id) {
      return state.checks && state.checks[id];
    }).length;
    var pct = ids.length ? Math.round((done / ids.length) * 100) : 0;
    document.getElementById("progressFill").style.width = pct + "%";
    document.getElementById("progressText").textContent = done + " / " + ids.length + " (" + pct + "%)";
  }

  function persistChecks() {
    saveState(state);
    updateProgress();
  }

  renderNav();
  renderMain();
  if (!state.checks) state.checks = {};
  if (!state.notes) state.notes = {};
  applyChecksFromState();

  document.getElementById("main").addEventListener("change", function (e) {
    var t = e.target;
    if (t && t.matches && t.matches("input[data-check]")) {
      var id = t.getAttribute("data-check");
      state.checks[id] = t.checked;
      persistChecks();
    }
  });

  document.getElementById("main").addEventListener("input", function (e) {
    var t = e.target;
    if (t && t.matches && t.matches("textarea[data-notes]")) {
      var sid = t.getAttribute("data-notes");
      state.notes[sid] = t.value;
      saveState(state);
    }
  });

  document.getElementById("main").addEventListener("click", function (e) {
    var btn = e.target.closest(".btn-section-all, .btn-section-none");
    if (!btn) return;
    var sectionId = btn.getAttribute("data-section");
    var sec = MANUAL.sections.find(function (s) {
      return s.id === sectionId;
    });
    if (!sec) return;
    var val = btn.classList.contains("btn-section-all");
    (sec.blocks || []).forEach(function (blk) {
      (blk.items || []).forEach(function (it) {
        state.checks[it.id] = val;
        var el = document.getElementById(it.id);
        if (el) el.checked = val;
      });
    });
    persistChecks();
  });

  document.getElementById("btnReset").addEventListener("click", function () {
    if (!confirm("Xóa toàn bộ checkbox và ghi chú đã lưu trong trình duyệt này?")) return;
    state = { checks: {}, notes: {} };
    saveState(state);
    collectAllIds().forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.checked = false;
    });
    MANUAL.sections.forEach(function (sec) {
      var ta = document.getElementById("notes-" + sec.id);
      if (ta) ta.value = "";
    });
    updateProgress();
  });

  document.getElementById("btnExport").addEventListener("click", function () {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "corelia-qa-checklist-export.json";
    a.click();
    URL.revokeObjectURL(a.href);
  });

  document.getElementById("btnImport").addEventListener("click", function () {
    document.getElementById("importFile").click();
  });

  document.getElementById("importFile").addEventListener("change", function (ev) {
    var f = ev.target.files && ev.target.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var imported = JSON.parse(reader.result);
        if (!imported.checks) imported.checks = {};
        if (!imported.notes) imported.notes = {};
        state = imported;
        saveState(state);
        applyChecksFromState();
      } catch (err) {
        alert("File JSON không hợp lệ.");
      }
      ev.target.value = "";
    };
    reader.readAsText(f);
  });
})();
  </script>
