<!doctype html><html lang="en"><head><meta charset="UTF-8"><title>Public UI responsive review</title><style>body{margin:0;background:#eef1f5;font:14px system-ui;color:#182233}header{padding:16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}button,select,input{padding:10px}iframe{display:block;border:0;margin:16px auto;background:white;max-width:none}output{font-family:monospace}</style></head><body><header><label>Route <input id="route" value="/jobs"></label><button id="go">Open local page</button><span id="presets"></span><label>Viewport <select id="width"><option>360</option><option selected>390</option><option>768</option><option>1024</option><option>1440</option></select></label><label><input type="checkbox" id="dark">Dark</label><button id="measure">Measure</button><output id="result"></output></header><iframe id="preview" title="Local public page preview" width="390" height="1000" src="/jobs"></iframe><script type="module">
const frame=document.querySelector('#preview');
const result=document.querySelector('#result');
for(const width of [360,390,768,1024,1440]){const button=document.createElement('button');button.textContent=width+'px';button.onclick=()=>{frame.width=String(width);document.querySelector('#width').value=String(width);requestAnimationFrame(measure);};document.querySelector('#presets').append(button);}
function measure(){const d=frame.contentDocument;result.textContent=JSON.stringify({path:frame.contentWindow.location.pathname,width:frame.contentWindow.innerWidth,client:d.documentElement.clientWidth,scroll:d.documentElement.scrollWidth,dark:d.documentElement.classList.contains('dark')});}
function theme(){frame.contentDocument?.documentElement.classList.toggle('dark',document.querySelector('#dark').checked);measure();}
document.querySelector('#width').onchange=e=>{frame.width=e.target.value;requestAnimationFrame(measure);};
document.querySelector('#go').onclick=()=>{const path=document.querySelector('#route').value;if(path.startsWith('/')&&!path.startsWith('//'))frame.src=path;};
document.querySelector('#dark').onchange=theme;document.querySelector('#measure').onclick=measure;frame.onload=theme;
</script></body></html>
